[bar.default]
center = [ "date", "clock" ]
contact_shadow = false
end = [
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "session"
]
margin_ends = 0
padding = 20
radius = 0
shadow = false
start = [ "workspaces" ]

[dock]
shadow = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1158.666748046875
    output = "eDP-1"
    placement_height = 1280.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = []

[shell]
polkit_agent = true
popup_shadows = false

    [shell.animation]
    enabled = false

    [shell.panel]
    shadow = false

    [shell.screenshot]
    directory = "/home/fw13/Pictures/Screenshots"

[theme]
builtin = "Ayu"
community_palette = "Ayu Red"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "mango", "qt" ]
    community_ids = [ "heroiclauncher" ]

[wallpaper]
directory = "/home/fw13/Pictures/Wallpapers"

    [wallpaper.automation]
    enabled = true
    interval_seconds = 60

[weather]
enabled = false
